{% extends 'base.html' %}
{% block content %}

<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
    <h2 class="text-primary fw-bold">신규 재고실사</h2>
    <a href="{{ url_for('inventory.audit_list') }}" class="btn btn-outline-secondary btn-sm" style="white-space:nowrap;">목록으로</a>
</div>

<div class="card border-0 shadow-sm mb-4" style="max-width:600px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label fw-bold">실사일</label>
                <input type="date" name="audit_date" class="form-control form-control-sm" value="{{ today }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">실사자</label>
                <input type="text" name="auditor_name" class="form-control form-control-sm" value="{{ user_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">대상 카테고리</label>
                <select name="target_category" class="form-select form-select-sm">
                    <option value="">전체 품목</option>
                    {% for c in categories %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
                <div class="form-text">비워두면 전체 활성 품목이 실사 대상이 됩니다.</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">메모</label>
                <textarea name="note" class="form-control form-control-sm" rows="2" placeholder="예: 3월 정기실사"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm" style="white-space:nowrap;">실사 생성</button>
                <a href="{{ url_for('inventory.audit_list') }}" class="btn btn-secondary btn-sm" style="white-space:nowrap;">취소</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
