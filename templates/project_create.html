{% extends 'base.html' %}

{% block content %}
<div class="container-fluid bg-white p-3 p-md-4 rounded shadow-sm">
    <h2 class="mb-4">📐 신규 설계현장 등록</h2>
    
    <form method="POST" action="{{ url_for('project.project_create') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="row mb-3">
            <div class="col-md-12">
                <label class="form-label fw-bold">현장 가칭 (필수)</label>
                <input type="text" name="temp_name" class="form-control" placeholder="예: 평택 고덕 야구장 조도설계" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">현장 주소</label>
                <input type="text" name="site_address" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">납품지 주소 (미정 시 공란)</label>
                <input type="text" name="shipping_address" class="form-control">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">계약 예정일</label>
                <input type="date" name="expected_contract_date" class="form-control">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">현장 특이사항 및 메모</label>
            <textarea name="site_memo" class="form-control" rows="3" placeholder="참조사항 입력..."></textarea>
        </div>

        <hr>
        <h5 class="mb-3">📦 초기 설계 스펙</h5>
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-2">
                    <strong>💡 조명 기구 / 타워 목록</strong>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRow('lightTable', 'light')">+ 항목 추가</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-sm" id="lightTable">
                        <thead class="table-light"><tr><th>분류</th><th>모델명</th><th>수량</th><th style="width: 40px;">X</th></tr></thead>
                        <tbody>
                            <tr>
                                <td>
                                    <select name="light_category[]" class="form-select form-select-sm">
                                        {% for opt in detail_item_options %}
                                        <option value="{{ opt }}">{{ opt }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="text" name="light_model[]" class="form-control form-control-sm"></td>
                                <td><input type="number" name="light_qty[]" class="form-control form-control-sm" value="0"></td>
                                <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">X</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fs-5 fw-bold">🚀 설계 현장 생성하기</button>
    </form>
</div>

<script>
    const detailItemOptionsHtml = `{% for opt in detail_item_options %}<option value="{{ opt }}">{{ opt }}</option>{% endfor %}`;

    function addRow(tableId, prefix) {
        const tbody = document.getElementById(tableId).querySelector('tbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><select name="${prefix}_category[]" class="form-select form-select-sm">${detailItemOptionsHtml}</select></td>
            <td><input type="text" name="${prefix}_model[]" class="form-control form-control-sm"></td>
            <td><input type="number" name="${prefix}_qty[]" class="form-control form-control-sm" value="0"></td>
            <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">X</button></td>
        `;
        tbody.appendChild(tr);
    }
</script>
{% endblock %}
