{% extends 'base.html' %}

{% block content %}
<style>
    .drawing-list-table .clickable-row { cursor: pointer; }
    .drawing-list-table .clickable-row:hover { background: #f1f5f9; }
</style>

<div class="page-hero mg-fade">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <div>
            <div class="hero-eyebrow">Drawing Management</div>
            <h2>도면관리</h2>
            <div class="hero-sub">프로젝트별 도면 PDF를 업로드하고 열람합니다</div>
        </div>
        <div class="d-flex flex-wrap gap-2"></div>
    </div>
</div>

<div class="card shadow-sm border-0 mg-fade" style="animation-delay:.05s">
    <div class="card-header bg-white fw-bold">프로젝트 목록</div>
    <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0 drawing-list-table">
            <thead class="table-light">
                <tr>
                    <th style="width:120px;">관리번호</th>
                    <th>현장명</th>
                    <th style="width:120px;">도면건수</th>
                </tr>
            </thead>
            <tbody>
                {% for p in projects %}
                <tr class="clickable-row" data-href="{{ url_for('drawing.drawings_project', project_id=p.id) }}">
                    <td>{{ p.project_no }}</td>
                    <td>
                        <a href="{{ url_for('drawing.drawings_project', project_id=p.id) }}" class="text-dark text-decoration-none fw-bold">
                            {{ p.temp_name }}
                        </a>
                    </td>
                    <td>{{ p.drawings|length }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">등록된 프로젝트가 없습니다.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.drawing-list-table .clickable-row').forEach((row) => {
        row.addEventListener('click', function (e) {
            const interactive = e.target.closest('a, button, input, select, textarea, label, form');
            if (interactive) return;

            const href = row.dataset.href;
            if (href) window.location.href = href;
        });
    });
});
</script>
{% endblock %}
