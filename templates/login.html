<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Light-Sync ERP 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-box {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.05);
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
        }
        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
        }
        .brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }
        .brand-sub {
            font-size: .85rem;
            color: #94a3b8;
            font-weight: 400;
        }
        .nav-tabs {
            border-bottom: 2px solid #f1f5f9;
        }
        .nav-tabs .nav-link {
            color: #94a3b8;
            font-weight: 600;
            font-size: .9rem;
            border: none;
            border-bottom: 2px solid transparent;
            padding: .6rem 1.2rem;
            transition: all .2s;
        }
        .nav-tabs .nav-link.active {
            color: #0f172a;
            border-color: transparent;
            border-bottom: 2px solid #3b82f6;
            background: transparent;
        }
        .nav-tabs .nav-link:hover:not(.active) {
            color: #475569;
            border-color: transparent;
        }
        .form-label {
            font-size: .78rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1.5px solid #e2e8f0;
            transition: all .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: .95rem;
            padding: .7rem 0;
            transition: all .2s;
            box-shadow: 0 4px 12px rgba(59,130,246,.25);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 20px rgba(59,130,246,.35);
            transform: translateY(-1px);
        }
        .btn-register {
            background: #1e293b;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: .95rem;
            padding: .7rem 0;
            transition: all .2s;
        }
        .btn-register:hover {
            background: #0f172a;
            transform: translateY(-1px);
        }
        .alert {
            border-radius: 10px;
            font-size: .85rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="text-center mb-4">
            <div class="brand-title">Light-Sync</div>
            <div class="brand-sub">Enterprise Resource Planning</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category != 'message' else 'danger' }} py-2 text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <ul class="nav nav-tabs mb-4 justify-content-center" id="myTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">로그인</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">계정 신청</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="login" role="tabpanel">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">아이디</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">비밀번호</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-login btn-primary w-100 py-2">로그인</button>
                </form>
            </div>

            <div class="tab-pane fade" id="register" role="tabpanel">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-2">
                        <label class="form-label">아이디</label>
                        <input type="text" name="new_username" class="form-control form-control-sm" required>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6">
                            <label class="form-label">비밀번호</label>
                            <input type="password" name="new_password" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">비밀번호 확인</label>
                            <input type="password" name="new_password_conf" class="form-control form-control-sm" required>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">이름</label>
                        <input type="text" name="new_fullname" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">연락처</label>
                        <input type="text" name="new_phone" class="form-control form-control-sm" placeholder="010-0000-0000" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">소속 부서</label>
                        <select name="new_group" class="form-select form-select-sm" required>
                            {% for group in groups %}
                                <option value="{{ group }}">{{ group }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-register text-white w-100 py-2">가입 신청하기</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
