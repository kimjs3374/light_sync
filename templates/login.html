<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Light-Sync ERP 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .nav-tabs .nav-link { color: #64748b; font-weight: bold; border-bottom: 2px solid transparent; }
        .nav-tabs .nav-link.active { color: #0f172a; border-color: #e2e8f0 #e2e8f0 #fff; border-bottom: 2px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="text-center mb-1">⚡ Light-Sync</h2>
        <p class="text-center text-muted mb-4">ERP 보안 시스템</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category != 'message' else 'danger' }} py-2 text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <ul class="nav nav-tabs mb-4 justify-content-center" id="myTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">🔑 로그인</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">📝 계정 신청</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="login" role="tabpanel">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">아이디</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">비밀번호</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">로그인</button>
                </form>
            </div>

            <div class="tab-pane fade" id="register" role="tabpanel">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-2">
                        <label class="form-label text-muted small fw-bold">아이디</label>
                        <input type="text" name="new_username" class="form-control form-control-sm" required>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold">비밀번호</label>
                            <input type="password" name="new_password" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold">비밀번호 확인</label>
                            <input type="password" name="new_password_conf" class="form-control form-control-sm" required>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label text-muted small fw-bold">이름</label>
                        <input type="text" name="new_fullname" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label text-muted small fw-bold">연락처</label>
                        <input type="text" name="new_phone" class="form-control form-control-sm" placeholder="010-0000-0000" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">소속 부서</label>
                        <select name="new_group" class="form-select form-select-sm" required>
                            {% for group in groups %}
                                <option value="{{ group }}">{{ group }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold">가입 신청하기</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
