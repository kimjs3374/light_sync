{% extends 'base.html' %}
{% block title %}타워 추가 — 조명배치도{% endblock %}

{% block content %}
<style>
  /* ── 타워 추가 폼 전용 ─────────────────────────────── */
  .page-hero::before {
    background: radial-gradient(circle, rgba(245,158,11,.1) 0%, transparent 65%);
  }
  .hero-eyebrow.is-amber { background: rgba(245,158,11,.15); color: #fbbf24; }

  .form-card {
    background: var(--mg-surface); border: 1px solid var(--mg-border);
    border-radius: var(--mg-radius); box-shadow: var(--mg-shadow);
    padding: 1.2rem 1.4rem; max-width: 540px;
  }
  .form-card .section-kicker { margin-bottom: .6rem; }
  .form-card label { font-size: .75rem; font-weight: 600; color: var(--mg-muted); }

  .grid-preview { display: inline-grid; gap: 3px; margin-top: .4rem; }
  .grid-preview .cell {
    width: 30px; height: 30px; border-radius: .3rem;
    background: var(--mg-bg); border: 1px solid var(--mg-border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mg-mono); font-size: .55rem; color: var(--mg-subtle); font-weight: 700;
  }
</style>

<!-- 히어로 -->
<div class="page-hero mg-fade">
  <span class="hero-eyebrow is-amber"><i class="bi bi-lightbulb-fill"></i> LIGHTING LAYOUT</span>
  <h2>타워 추가</h2>
  <p class="hero-sub">현장에 새 타워 배치도를 생성합니다</p>
</div>

<!-- 폼 -->
<div class="form-card mg-fade" style="animation-delay:.05s;">
  <p class="section-kicker">TOWER INFO</p>
  <form method="POST" action="{{ url_for('lighting_layout.add_tower') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label">현장 선택 *</label>
      <select name="project_id" class="form-select form-select-sm" required>
        <option value="">-- 현장 선택 --</option>
        {% for p in projects %}
        <option value="{{ p.id }}" {% if preselect_id == p.id %}selected{% endif %}>
          {{ p.project_no }} — {{ p.name or p.temp_name or '(미정)' }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">타워 이름 *</label>
      <input type="text" name="tower_name" class="form-control form-control-sm" placeholder="예: T1, 타워A" required>
    </div>

    <div class="row mb-3">
      <div class="col-6">
        <label class="form-label">행(세로) *</label>
        <input type="number" name="rows" id="inp-rows" class="form-control form-control-sm" value="2" min="1" max="20" required>
      </div>
      <div class="col-6">
        <label class="form-label">열(가로) *</label>
        <input type="number" name="cols" id="inp-cols" class="form-control form-control-sm" value="3" min="1" max="20" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" style="color:var(--mg-subtle);">미리보기</label>
      <div id="grid-preview" class="grid-preview"></div>
    </div>

    <div class="row mb-3">
      <div class="col-8">
        <label class="form-label">투광등 모델명</label>
        <input type="text" name="model_name" class="form-control form-control-sm" placeholder="예: MG-FL400">
      </div>
      <div class="col-4">
        <label class="form-label">와트(W)</label>
        <input type="number" name="watt" class="form-control form-control-sm" placeholder="400">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">비고</label>
      <textarea name="note" class="form-control form-control-sm" rows="2"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-sm btn-hi"><i class="bi bi-check-lg"></i> 생성</button>
      <a href="{{ url_for('lighting_layout.layout_list') }}" class="btn btn-sm btn-outline-secondary">취소</a>
    </div>
  </form>
</div>

<script>
function renderPreview() {
  const rows = Math.max(1, Math.min(20, parseInt(document.getElementById('inp-rows').value) || 2));
  const cols = Math.max(1, Math.min(20, parseInt(document.getElementById('inp-cols').value) || 3));
  const g = document.getElementById('grid-preview');
  g.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
  let html = '', n = 1;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      html += `<div class="cell">${n++}</div>`;
  g.innerHTML = html;
}
document.getElementById('inp-rows').addEventListener('input', renderPreview);
document.getElementById('inp-cols').addEventListener('input', renderPreview);
renderPreview();
</script>
{% endblock %}
