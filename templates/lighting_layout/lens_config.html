{% extends 'base.html' %}
{% block title %}렌즈관리 — 조명배치도{% endblock %}

{% block content %}
<style>
  .page-hero::before {
    background: radial-gradient(circle, rgba(245,158,11,.1) 0%, transparent 65%);
  }
  .hero-eyebrow.is-amber { background: rgba(245,158,11,.15); color: #fbbf24; }

  .config-panel {
    background: var(--mg-surface); border: 1px solid var(--mg-border);
    border-radius: var(--mg-radius); box-shadow: var(--mg-shadow);
    padding: 1rem 1.2rem; max-width: 640px;
  }
  .config-table { width: 100%; border-collapse: collapse; }
  .config-table th {
    font-size: .68rem; font-weight: 600; color: var(--mg-muted);
    text-transform: uppercase; letter-spacing: .04em;
    padding: .4rem .5rem; border-bottom: 2px solid var(--mg-border);
    text-align: left;
  }
  .config-table td { padding: .35rem .4rem; border-bottom: 1px solid var(--mg-border); vertical-align: middle; }
  .config-table tr:last-child td { border-bottom: none; }
  .config-table input { font-size: .8rem; border-radius: .35rem; border: 1px solid var(--mg-border); padding: .3rem .5rem; width: 100%; }
  .config-table input:focus { outline: none; border-color: var(--mg-primary); box-shadow: 0 0 0 2px rgba(37,99,235,.1); }
  .config-table .inp-model { width: 120px; font-weight: 700; }
  .config-table .inp-angles { font-family: var(--mg-mono); }
  .config-table .btn-del {
    border: none; background: none; color: var(--mg-danger); cursor: pointer;
    font-size: .85rem; padding: .2rem; border-radius: .3rem; transition: background .1s;
  }
  .config-table .btn-del:hover { background: #fef2f2; }
  .preview-chips { display: flex; flex-wrap: wrap; gap: .2rem; margin-top: .15rem; }
  .preview-chips .pc {
    font-size: .62rem; font-weight: 600; padding: .12rem .3rem; border-radius: .25rem;
    background: #f0fdf4; color: #059669; border: 1px solid #bbf7d0;
    font-family: var(--mg-mono);
  }
  .toolbar-bottom { display: flex; gap: .4rem; margin-top: .8rem; align-items: center; }

  .toast-msg {
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
    padding: .45rem .9rem; border-radius: .45rem;
    font-size: .78rem; font-weight: 600; box-shadow: 0 4px 16px rgba(15,23,42,.15);
    animation: mgFadeUp .3s both;
  }
  .toast-msg.is-ok { background: var(--mg-success); color: #fff; }
  .toast-msg.is-err { background: var(--mg-danger); color: #fff; }
</style>

<div class="page-hero mg-fade">
  <span class="hero-eyebrow is-amber"><i class="bi bi-sliders"></i> LENS CONFIG</span>
  <h2>렌즈관리</h2>
  <p class="hero-sub">모델별 호환 렌즈각도 설정 — 타워 모델명에 키워드가 포함되면 자동 매칭</p>
</div>

<div class="config-panel mg-fade" style="animation-delay:.05s;">
  <p class="section-kicker">MODEL &times; LENS ANGLES</p>
  <table class="config-table" id="config-table">
    <thead>
      <tr>
        <th style="width:130px;">모델 키워드</th>
        <th>렌즈각도 ( <code>|</code> 구분 )</th>
        <th style="width:36px;"></th>
      </tr>
    </thead>
    <tbody id="config-body">
      {% for cfg in configs %}
      <tr>
        <td><input class="inp-model" value="{{ cfg.model_name }}" placeholder="모델명"></td>
        <td>
          <input class="inp-angles" value="{{ cfg.angles }}" placeholder="20|35|55" oninput="renderPreview(this)">
          <div class="preview-chips"></div>
        </td>
        <td><button type="button" class="btn-del" onclick="this.closest('tr').remove()" title="삭제"><i class="bi bi-x-lg"></i></button></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="toolbar-bottom">
    <button type="button" class="btn btn-xs btn-outline-secondary" onclick="addRow()">
      <i class="bi bi-plus"></i> 모델 추가
    </button>
    <div style="flex:1;"></div>
    <button type="button" class="btn btn-xs btn-success" onclick="saveAll()">
      <i class="bi bi-check-lg"></i> 저장
    </button>
    <a href="{{ url_for('lighting_layout.layout_list') }}" class="btn btn-xs btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> 배치도 목록
    </a>
  </div>
</div>

<script>
function addRow() {
  const tbody = document.getElementById('config-body');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="inp-model" value="" placeholder="모델명"></td>
    <td>
      <input class="inp-angles" value="" placeholder="20|35|55" oninput="renderPreview(this)">
      <div class="preview-chips"></div>
    </td>
    <td><button type="button" class="btn-del" onclick="this.closest('tr').remove()" title="삭제"><i class="bi bi-x-lg"></i></button></td>
  `;
  tbody.appendChild(tr);
  tr.querySelector('.inp-model').focus();
}

function renderPreview(inp) {
  const chips = inp.closest('td').querySelector('.preview-chips');
  const vals = inp.value.split('|').map(v => v.trim()).filter(Boolean);
  chips.innerHTML = vals.map(v => `<span class="pc">${v}</span>`).join('');
}

// 초기 프리뷰 렌더링
document.querySelectorAll('.inp-angles').forEach(inp => renderPreview(inp));

function showToast(msg, ok) {
  const t = document.createElement('div');
  t.className = 'toast-msg ' + (ok ? 'is-ok' : 'is-err');
  t.innerHTML = `<i class="bi bi-${ok ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function saveAll() {
  const rows = document.querySelectorAll('#config-body tr');
  const items = [];
  rows.forEach(tr => {
    const model = tr.querySelector('.inp-model').value.trim();
    const angles = tr.querySelector('.inp-angles').value.trim();
    if (model && angles) items.push({ model_name: model, angles: angles });
  });
  fetch('{{ url_for("lighting_layout.lens_config_save") }}', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}' },
    body: JSON.stringify({ items })
  })
  .then(r => r.json())
  .then(data => showToast(data.msg, data.ok))
  .catch(() => showToast('네트워크 오류', false));
}
</script>
{% endblock %}
