{% extends 'base.html' %}
{% block title %}대화방 백업{% endblock %}
{% block head %}
<style>
  .cr-wrap{max-width:720px;margin:0 auto;}
  .cr-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .cr-head h5{margin:0;font-weight:700;}
  .cr-badge{font-size:12px;color:#666;background:#f4f5f7;border-radius:6px;padding:3px 8px;white-space:nowrap;}
  .cr-room{display:flex;align-items:center;gap:14px;padding:14px 12px;border-bottom:1px solid #eee;
    text-decoration:none;color:#1a1a2e;border-radius:10px;}
  .cr-room:hover{background:#f6f8fb;}
  .cr-ava{width:48px;height:48px;border-radius:16px;color:#fff;font-weight:700;font-size:20px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cr-info{flex-grow:1;min-width:0;}
  .cr-name{font-weight:600;font-size:15px;}
  .cr-sub{font-size:12px;color:#999;margin-top:2px;}
  .cr-cnt{font-size:12px;color:#3457d5;background:#eef2ff;border-radius:10px;padding:3px 9px;white-space:nowrap;}
</style>
{% endblock %}
{% block content %}
<div class="cr-wrap">
  <div class="cr-head">
    <h5>대화방 백업</h5>
    <span class="cr-badge">카카오워크</span>
  </div>
  {% for r in rooms %}
  <a class="cr-room" href="{{ url_for('chat_archive.room_view', conv_id=r.id) }}">
    <div class="cr-ava" style="background:{{ r.color }}">{{ r.name[0] }}</div>
    <div class="cr-info">
      <div class="cr-name">{{ r.name }}</div>
      <div class="cr-sub">마지막 대화 {{ r.last_date }}</div>
    </div>
    <span class="cr-cnt">{{ '{:,}'.format(r.count) }}건</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
