{% extends "base.html" %}
{% block head %}
<link href="{{ url_for('static', filename='css/mail.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid pt-1 pb-0">
    {% if all_accounts and all_accounts|length > 1 %}
    <div class="mail-account-tabs">
        {% for a in all_accounts %}
        <button class="mail-account-tab{% if a.id == account_id %} active{% endif %}" onclick="location.href='/mail/{{ 'shared' if mail_mode == 'shared' else 'personal' }}?account={{ a.id }}'">
            <span class="mail-account-tab-email">{{ a.email.split('@')[0] }}</span>
            <span class="mail-account-tab-domain">@{{ a.email.split('@')[1] }}</span>
        </button>
        {% endfor %}
    </div>
    {% endif %}
    <div class="mail-wrap">
        <div class="mail-sidebar" id="folderSidebar"></div>
        <script>
        (function(){
            try {
                var aid = {{ account_id }};
                var el = document.getElementById('folderSidebar');
                if (el) el.innerHTML = sessionStorage.getItem('mail_sidebar_html_' + aid) || '';
            } catch(e) {}
        })();
        </script>
        <div class="mail-body">
            <div class="mail-toolbar">
                <a href="#" onclick="history.back();return false;" class="btn btn-sm btn-outline-secondary">← 목록</a>
                <div class="d-flex gap-1">
                    <a href="{{ url_for('mail.mail_compose', reply=uid, folder=folder, account=account_id, mode=mail_mode) }}" class="btn btn-sm btn-outline-primary">↩ 답장</a>
                    <a href="{{ url_for('mail.mail_compose', reply_all=uid, folder=folder, account=account_id, mode=mail_mode) }}" class="btn btn-sm btn-outline-primary">↩ 전체답장</a>
                    <a href="{{ url_for('mail.mail_compose', forward=uid, folder=folder, account=account_id, mode=mail_mode) }}" class="btn btn-sm btn-outline-secondary">→ 전달</a>
                    <a href="{{ url_for('mail.mail_compose', resend=uid, folder=folder, account=account_id, mode=mail_mode) }}" class="btn btn-sm btn-outline-secondary">⟳ 다시보내기</a>
                    <button class="btn btn-sm btn-outline-warning" onclick="Mail.togglePin({{ uid }})">📌 고정</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="Mail.printMail({{ uid }})">🖨 인쇄</button>
                    <button class="btn btn-sm btn-outline-danger" id="deleteBtn">삭제</button>
                </div>
            </div>
            <div id="mailContent">
                <div class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm"></span> 로딩 중...</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/mail.js') }}?v=1779200000"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    Mail.accountId = {{ account_id }};
    Mail.currentFolder = '{{ folder }}';
    Mail.loadFolders(false);
    MailRead.init({{ uid }}, '{{ folder }}', {{ account_id }});
});
</script>
{% endblock %}
