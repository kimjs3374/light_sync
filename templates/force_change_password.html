<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 필수 - Light-Sync ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: .75rem;
        }
        .change-box {
            background: #fff;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
        }
        .change-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #ef4444, #f59e0b);
        }
        .btn-save {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; border-radius: 10px; font-weight: 700;
            font-size: .95rem; padding: .7rem 0;
            box-shadow: 0 4px 12px rgba(59,130,246,.25);
        }
        .btn-save:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        @media (max-width: 480px) {
            body { padding: .5rem; align-items: flex-start; }
            .change-box { max-width: 100%; border-radius: 12px;
                padding: 1.5rem 1.1rem; margin-top: 2rem;
                box-shadow: 0 8px 32px rgba(0,0,0,.4); }
        }
    </style>
</head>
<body>
    <div class="change-box">
        <div class="text-center mb-3">
            <div style="font-size:2.5rem;">🔒</div>
            <h4 class="fw-bold mt-2">비밀번호 변경 필수</h4>
            <p class="text-muted" style="font-size:.88rem;">초기화된 비밀번호를 사용 중입니다.<br>새 비밀번호를 설정해주세요.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category != 'message' else 'danger' }} py-2 text-center" style="font-size:.85rem;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.force_change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:.85rem;">새 비밀번호</label>
                <input type="password" name="new_password" class="form-control" required data-pw-rule id="forcePw">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" style="font-size:.85rem;">새 비밀번호 확인</label>
                <input type="password" name="confirm_password" class="form-control" required data-pw-match="#forcePw">
                <div class="invalid-feedback">비밀번호가 일치하지 않습니다.</div>
            </div>
            <button type="submit" class="btn btn-save btn-primary w-100 py-2">비밀번호 변경</button>
        </form>
    </div>
<script src="{{ url_for('static', filename='js/password-utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/no-double-submit.js') }}"></script>
</body>
</html>
