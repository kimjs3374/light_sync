<!-- 신규 메일시스템(mail.mgnt.kr) 전환 안내 모달 -->
<div class="modal fade" id="mailMigrationModal" tabindex="-1" aria-labelledby="mailMigrationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border:none;border-radius:14px;overflow:hidden;">
            <div class="modal-header" style="background:#0f172a;color:#fff;border-bottom:none;padding:14px 20px;">
                <h6 class="modal-title mb-0" id="mailMigrationModalLabel" style="font-weight:700;">✉️ 새 메일 시스템 안내</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body" style="padding:20px;">
                <p style="font-size:.95rem;margin-bottom:14px;line-height:1.6;">
                    <strong style="color:#2563eb;">mail.mgnt.kr</strong> 로 전환하여<br>
                    신규 메일 시스템으로 이동합니다.
                </p>
                <div style="background:#fef3c7;border-left:3px solid #f59e0b;border-radius:6px;padding:10px 12px;font-size:.85rem;color:#92400e;line-height:1.6;">
                    기존 웹메일(<span data-role="legacy-name">공용메일</span>)은 당분간 사용 가능하지만
                    <strong>예고 없이 서비스가 종료될 수 있습니다.</strong>
                </div>
            </div>
            <div class="modal-footer" style="border-top:1px solid #f1f5f9;padding:12px 20px;gap:6px;">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-role="go-legacy" style="white-space:nowrap;">취소 · 기존 웹메일</button>
                <button type="button" class="btn btn-primary btn-sm" data-role="go-new" style="white-space:nowrap;">확인 · 새 메일시스템</button>
            </div>
        </div>
    </div>
</div>
