<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{{ url_for('auth.change_password') }}" method="POST" id="changePasswordForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="changePasswordModalLabel">비밀번호 변경</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">현재 비밀번호</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="modal_new_password" class="form-label">새 비밀번호</label>
                        <input type="password" class="form-control" id="modal_new_password" name="new_password" required data-pw-rule>
                    </div>
                    <div class="mb-3">
                        <label for="modal_confirm_password" class="form-label">새 비밀번호 확인</label>
                        <input type="password" class="form-control" id="modal_confirm_password" name="confirm_password" required data-pw-match="#modal_new_password">
                        <div class="invalid-feedback">비밀번호가 일치하지 않습니다.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">변경</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
// 모달 열릴 때 password-utils 재초기화 (동적 DOM)
document.getElementById('changePasswordModal').addEventListener('shown.bs.modal', function(){
    var s = document.createElement('script');
    s.src = '{{ url_for("static", filename="js/password-utils.js") }}';
    document.body.appendChild(s);
});
</script>
