<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{{ url_for('auth.change_password') }}" method="POST" id="changePasswordForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="changePasswordModalLabel">비밀번호 변경</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">현재 비밀번호</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">새 비밀번호</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                        <div class="form-text">6자 이상 입력해주세요.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">새 비밀번호 확인</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                        <div class="invalid-feedback" id="pwMismatchMsg">비밀번호가 일치하지 않습니다.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary" id="changePwBtn">변경</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
(function(){
    var form = document.getElementById('changePasswordForm');
    if (!form) return;
    form.addEventListener('submit', function(e){
        var newPw = document.getElementById('new_password').value;
        var confirmPw = document.getElementById('confirm_password').value;
        var confirmInput = document.getElementById('confirm_password');
        if (newPw.length < 6) {
            e.preventDefault();
            alert('비밀번호는 6자 이상 입력해주세요.');
            return;
        }
        if (newPw !== confirmPw) {
            e.preventDefault();
            confirmInput.classList.add('is-invalid');
            return;
        }
        confirmInput.classList.remove('is-invalid');
    });
    document.getElementById('confirm_password').addEventListener('input', function(){
        this.classList.remove('is-invalid');
    });
})();
</script>
